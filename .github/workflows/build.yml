name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: показать SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d $ANDROID_HOME/build-tools/* || true
          ls -d $ANDROID_HOME/platforms/* || true

      - name: сборка
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: артефакт
        uses: actions/upload-artifact@v4
        with:
          name: TG-Purge-apk
          path: TG-Purge.apk
          if-no-files-found: error

      - name: sha256
        run: sha256sum TG-Purge.apk
